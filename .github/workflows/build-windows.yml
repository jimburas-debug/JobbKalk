name: Bygg og publiser Windows-versjoner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test og bygg bærbar EXE
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Installer NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Bygg installasjonsfil
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\JobbKalk.nsi'
      - uses: actions/upload-artifact@v4
        with:
          name: JobbKalk-Windows-x64
          path: |
            artifacts/portable/JobbKalk.exe
            artifacts/JobbKalk-Setup-x64.exe
          if-no-files-found: error
      - name: Publiser permanent nedlasting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 `
            artifacts/portable/JobbKalk.exe `
            artifacts/JobbKalk-Setup-x64.exe `
            --repo $env:GITHUB_REPOSITORY `
            --title "JobbKalk v0.1.0" `
            --notes "Første testversjon for Windows 10/11 64-bit. Inneholder både installasjonsprogram og bærbar EXE. Programmet er foreløpig ikke kodesignert, og Windows SmartScreen kan derfor vise en advarsel ved oppstart."
